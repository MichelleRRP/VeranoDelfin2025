<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agrosoft - Registro</title>
    <link rel="icon" href="Recursos/favicon.png" type="image/png">
    <link rel="stylesheet" href="SignUp.css">        
</head>
<body>
    <div class="wallpaper">
        <div class="access-space">
            <h1>Ingresa tus datos</h1>
            <form class="form-space">
                <label>Nombre(s)</label>
                <input type="text">
                <label>Apellidos</label>
                <input type="text">
                <div class="button-layout">
                    <label>Usuario</label>
                    <label>Tipo</label>
                    <input type="text">
                    <select id="user-type">
                        <option>Investigador</option>
                        <option>Agricultor</option>
                    </select>
                </div>
                <label>Contraseña</label>
                <input type="password">
                <label>Repite la Contraseña</label>
                <input type="password">
                <div class="button-layout2"> 
                    <button id="SignIn">Registrate</button>
                    <button id="cancel-button">Regresar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
