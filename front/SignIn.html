<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agrosoft - Acceso</title>
    <link rel="icon" href="Recursos/favicon.png" type="image/png">
    <link rel="stylesheet" href="SignIn.css">        
</head>
<body>
    <div class="wallpaper">
        <div class="icon-space">
            <h1>Bienvenido a Agrosoft</h1>
        </div>
        <div class="access-space">
            <h1>Acceder a Agrosoft</h1>
            <form class="form-space">
                <input type="text" placeholder="Usuario">
                <input type="password" placeholder="Contraseña">
                <div class="button-layout">
                    <button>Iniciar Sesión</button>
                    <button id="icon-button"><img src="https://img.icons8.com/color/48/google-logo.png" id="google-icon"></button>
                    <button id="icon-button"><img src="https://img.icons8.com/ios-filled/50/1A1A1A/mac-os.png" id="apple-icon"></button>
                </div>
                <button id="SignIn">Registrate</button>
            </form>
        </div>
    </div>
</body>
</html>
